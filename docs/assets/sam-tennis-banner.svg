<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Sam Tennis Club — Every session, in sync.</title>
  <desc id="desc">Forest green and lime banner with a geometric tennis court and ball, introducing the Sam Tennis Club management system.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b271e"/><stop offset="1" stop-color="#1d5943"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a5cf86" stop-opacity=".18"/><stop offset="1" stop-color="#a5cf86" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="26" fill="url(#grid)"/>
  <circle cx="1010" cy="200" r="320" fill="url(#glow)"/>
  <path d="M60 55H1220" stroke="#b9d6bf" stroke-opacity=".2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="37" fill="#b9d6bf" font-size="11" letter-spacing="4">THE CLUB. CONNECTED.</text>
    <text x="1216" y="37" text-anchor="end" fill="#d5eaa7" font-size="11" letter-spacing="3">TENNIS CLUB OS / UI V2</text>
    <text x="64" y="151" fill="#f5f9f0" font-size="70" font-weight="800" letter-spacing="-2">SAM TENNIS</text>
    <text x="68" y="196" fill="#d5eaa7" font-size="22" letter-spacing="6">EVERY SESSION, IN SYNC.</text>
    <text x="68" y="242" fill="#c0d2c7" font-size="17">Courts. Classes. Finances. One clear view.</text>
    <g transform="translate(68 280)">
      <rect width="164" height="34" rx="17" fill="#d5eaa7"/>
      <text x="82" y="22" text-anchor="middle" fill="#123b2c" font-size="11" font-weight="700" letter-spacing="1">PERSIAN / RTL</text>
      <rect x="176" width="178" height="34" rx="17" fill="none" stroke="#a6c3af" stroke-opacity=".5"/>
      <text x="265" y="22" text-anchor="middle" fill="#dce8dd" font-size="11" letter-spacing="1">LOCAL WITH DOCKER</text>
    </g>
    <text x="68" y="366" fill="#95b5a1" font-size="11" letter-spacing="2">BUILT FOR THE RHYTHM OF YOUR CLUB</text>
  </g>
  <g transform="translate(852 85) rotate(12 140 110)">
    <rect x="-14" y="-14" width="306" height="252" rx="18" fill="#061e15" opacity=".25"/>
    <rect width="278" height="224" rx="3" fill="#3b7855" stroke="#d1e1bc" stroke-width="2"/>
    <g fill="none" stroke="#e3edcf" stroke-width="2" opacity=".85">
      <path d="M0 28H278M0 196H278M139 0V224M62 28V196M216 28V196M62 112H216"/>
    </g>
    <path d="M139 0V224" stroke="#092b1f" stroke-width="8"/>
    <path d="M139 0V224" stroke="#d7e4c9" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="250" cy="212" r="36" fill="#081e15" opacity=".2"/>
    <circle cx="244" cy="204" r="33" fill="#d5ea87"/>
    <path d="M219 183Q251 197 237 235M256 173Q237 201 274 217" fill="none" stroke="#f9ffdc" stroke-width="3"/>
  </g>
  <path d="M790 86V324" stroke="#b9d6bf" stroke-opacity=".14"/>
  <circle cx="790" cy="86" r="3" fill="#d5eaa7"/>
</svg>
