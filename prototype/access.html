<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex,nofollow">
  <title>نمونهٔ ورود و دسترسی | باشگاه تنیس سام</title>
  <link rel="icon" href="./assets/court-icon.svg" type="image/svg+xml">

<body>
  <main class="access-shell" id="access">
    <section class="access-card">
      <a class="local-brand" href="./"><span class="sam-mark" aria-hidden="true"></span><span><strong>باشگاه تنیس سام</strong><small dir="ltr">SAM TENNIS CLUB</small></span></a>
      <div class="access-heading"><h1>ورود به نمونهٔ باشگاه</h1><p>دسترسی مالک یا مدیر شعبه را امتحان کنید. مربی و شاگرد در پنل به‌عنوان پرونده ثبت می‌شوند.</p></div>
      <form class="local-form" id="demo-login">
        <label class="field"><span>نقش آزمایشی</span><select name="role" required>

        <button class="button primary">ورود به نمونه</button>
        <a class="panel-link" href="./">بازگشت به داشبورد نمونه</a>
      </form>
    </section>
    <aside class="access-image"><div><strong>باشگاه تنیس سام</strong><p>نمونهٔ رابط ورود و مدیریت کاربران</p></div></aside>
