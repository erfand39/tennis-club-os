<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>اعلان‌ها | باشگاه تنیس سام</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./local.css">
  <link rel="stylesheet" href="./pwa.css">
  <script type="module" src="./pwa/notice-preview.mjs"></script>
  <link rel="manifest" href="./pwa/manifest.webmanifest">
  <link rel="apple-touch-icon" href="./pwa/apple-icon.png">
  <meta name="theme-color" content="#174c3c">
</head>
<body>
  <div class="local-shell">
    <!-- preview-sidebar -->
    <main class="local-content notice-center">
      <header class="local-heading directory-heading"><div><h1>مرکز اعلان‌ها</h1><p>نمونهٔ تعاملی با دادهٔ ساختگی</p></div>
        <a class="button subtle" href="./install.html">نصب برنامه</a>
      </header>
      <section class="panel local-panel notice-device">
        <div><h2>اعلان روی این دستگاه</h2><p>می‌توانید نمایش یک اعلان نمونه را در مرورگر امتحان کنید.</p></div>
        <button class="button primary" id="test-notice" type="button" hidden>آزمایش اعلان نمونه</button>
        <p id="device-feedback" role="status" class="notice-message"></p>
      </section>
      <section class="panel local-panel" aria-label="اعلان‌های نمونه">
        <div class="notice-tools">
          <label class="field"><span>شعبه</span><select id="notice-branch"><option value="">همهٔ شعبه‌ها</option><option value="central">شعبهٔ مرکزی</option><option value="park">شعبهٔ پارک</option></select></label>
          <button class="button subtle" id="mark-all" type="button">علامت‌گذاری همه به‌عنوان خوانده‌شده</button>
        </div>
        <ul id="notice-list" class="notice-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
